/* ---------- Glossary (tap a dotted word) ---------- */
const GL = [
{k:"Absolute pressure",alt:["bar absolute","bar a"],d:"Pressure measured from a perfect vacuum (zero). Absolute pressure = gauge pressure + atmospheric pressure (about 1.013 bar). Pressure-temperature charts and vacuum levels use absolute pressure, so a gauge reading of 0 bar is about 1 bar absolute."},
{k:"Gauge pressure",alt:["bar gauge","bar g"],d:"Pressure measured relative to the atmosphere around you, which is what a normal manifold gauge shows. 0 bar gauge means the same as atmospheric pressure. Gauge pressure = absolute pressure minus about 1.013 bar."},
{k:"Saturation temperature",alt:["saturated evaporating temperature","saturated condensing temperature","saturation pressure","saturated"],d:"The temperature at which a refrigerant boils or condenses at a given pressure. Fix the pressure and you fix the temperature. A PT chart lists this relationship for each refrigerant."},
{k:"PT chart",alt:["pressure-temperature chart","pressure temperature"],d:"A pressure-temperature chart or slide rule showing the saturation temperature of each refrigerant at each pressure. Used to work out superheat and subcooling from gauge readings."},
{k:"Superheat",alt:["superheated"],d:"How many degrees a vapour is above its saturation temperature. Measured at the evaporator outlet: actual suction line temperature minus the saturated evaporating temperature from the suction pressure. Proves all liquid has boiled off before the compressor. Typically 5 to 10 K."},
{k:"Subcooling",alt:["subcool","subcooled"],d:"How many degrees a liquid is below its saturation temperature. Measured at the condenser outlet: saturated condensing temperature from the discharge pressure minus the actual liquid line temperature. Proves solid liquid is reaching the expansion device. Typically 3 to 8 K."},
{k:"Latent heat",d:"Heat absorbed or released while a substance changes state (liquid to vapour or back) with no change in temperature. The evaporator absorbs latent heat as refrigerant boils; the condenser rejects it as vapour condenses."},
{k:"Sensible heat",d:"Heat that changes the temperature of something without changing its state, such as warming air or cooling liquid refrigerant below saturation."},
{k:"Flash gas",d:"Vapour formed when liquid refrigerant suddenly drops in pressure, for example in the expansion device or in a liquid line with too little subcooling. Bubbles in the sight glass are flash gas."},
{k:"GWP",alt:["global warming potential"],d:"Global Warming Potential. How much heat 1 kg of a gas traps over 100 years compared with 1 kg of CO2, which is 1. The F-Gas Regulation uses the IPCC AR4 values: R32 = 675, R134a = 1430, R407C = 1774, R410A = 2088, R404A = 3922."},
{k:"CO2 equivalent",alt:["CO2e","tonnes CO2e","CO2 equivalent"],d:"The charge of refrigerant expressed as the amount of CO2 with the same warming effect. kg of refrigerant x GWP = kg CO2e; divide by 1000 for tonnes. Leak check and record thresholds (5, 50 and 500 tonnes) use this figure."},
{k:"ODP",alt:["ozone depletion potential","ozone depleting"],d:"Ozone Depletion Potential. How much a gas damages the ozone layer compared with R11 (CFC-11) at 1.0. Refrigerants containing chlorine or bromine (CFCs, HCFCs) have an ODP; HFCs and HFOs have an ODP of zero."},
{k:"ODS",alt:["ozone depleting substance","ozone depleting substances"],d:"Ozone Depleting Substance. Refrigerants such as R22 (HCFC) and R12 (CFC) that contain chlorine. Controlled by the ODS Regulation, separate from the F-Gas Regulation."},
{k:"F-gas",alt:["F-gases","fluorinated greenhouse gas","fluorinated greenhouse gases"],d:"Fluorinated greenhouse gas: HFCs, PFCs and SF6. They do not harm the ozone layer but have high GWPs. The F-Gas Regulation controls their use, leak checking, recovery and records."},
{k:"HFC",alt:["HFCs","hydrofluorocarbon"],d:"Hydrofluorocarbon. Synthetic refrigerants containing hydrogen, fluorine and carbon but no chlorine, e.g. R134a, R32, R410A, R404A. Zero ODP but high GWP. These are the main F-gases."},
{k:"HCFC",alt:["HCFCs","hydrochlorofluorocarbon"],d:"Hydrochlorofluorocarbon. Contains chlorine so it depletes ozone, e.g. R22. Banned for servicing since 2015 under the ODS Regulation."},
{k:"CFC",alt:["CFCs","chlorofluorocarbon"],d:"Chlorofluorocarbon. The original refrigerants such as R12 and R11, with very high ODP and GWP. Long banned."},
{k:"HFO",alt:["HFOs","hydrofluoro-olefin","hydrofluoro-olefins"],d:"Hydrofluoro-olefin. Newer synthetic refrigerants such as R1234yf and R1234ze with very low GWP (about 4 or less). Usually A2L, mildly flammable."},
{k:"Natural refrigerant",alt:["natural refrigerants"],d:"Refrigerants that occur in nature: hydrocarbons like R290 (propane) and R600a (isobutane), R744 (CO2) and R717 (ammonia). Very low GWP but each has its own hazard: flammability, high pressure or toxicity."},
{k:"Hermetically sealed",alt:["hermetic"],d:"A system where every refrigerant-containing part is joined by brazing, welding or a similar permanent joint, and the tested leak rate is below 3 g per year. Service ports and capped valves are allowed. When labelled as such, the leak check threshold rises from 5 to 10 tonnes CO2e."},
{k:"Zeotropic",alt:["zeotrope"],d:"A blend whose components boil at different temperatures, so it has a temperature glide. Numbered in the R400 series (R407C, R410A, R404A). Must be charged as liquid so the mix stays correct."},
{k:"Azeotropic",alt:["azeotrope"],d:"A blend that behaves like a single refrigerant, boiling and condensing at one temperature with no glide. Numbered in the R500 series (R507A, R502)."},
{k:"Temperature glide",alt:["glide"],d:"The temperature range over which a zeotropic blend boils or condenses at a fixed pressure: the difference between its bubble point and dew point. R407C has a glide of about 5 to 7 K; R410A is under 0.2 K."},
{k:"Bubble point",d:"For a blend at a given pressure, the temperature at which the first bubble of vapour forms when heating liquid. Use it when calculating subcooling."},
{k:"Dew point",d:"For a blend at a given pressure, the temperature at which the last drop of liquid evaporates. Use it when calculating superheat."},
{k:"A2L",d:"Safety class: A = lower toxicity, 2L = lower flammability with a slow burning velocity. Examples R32, R1234yf, R454B. Needs ignition sources removed and equipment rated for A2L."},
{k:"A1",d:"Safety class: lower toxicity and no flame propagation. Examples R134a, R410A, R404A. Still an asphyxiation and frostbite hazard."},
{k:"A3",d:"Safety class: lower toxicity but higher flammability. Hydrocarbons such as R290 (propane) and R600a (isobutane). Strict charge limits and spark-free equipment."},
{k:"B2L",d:"Safety class: higher toxicity and lower flammability. Ammonia (R717)."},
{k:"POE oil",alt:["POE","polyol ester"],d:"Polyol ester oil, used with HFC refrigerants. It is hygroscopic (absorbs moisture from the air), so keep containers sealed and systems open for as short a time as possible."},
{k:"Mineral oil",d:"Traditional compressor oil used with CFC and HCFC refrigerants such as R22. Does not mix with HFCs, so HFC systems use POE oil."},
{k:"Hygroscopic",d:"Absorbs moisture from the air. POE oil is strongly hygroscopic, which is why moisture control matters so much on HFC systems."},
{k:"OFN",alt:["oxygen-free nitrogen","oxygen free nitrogen","dry nitrogen","nitrogen"],d:"Oxygen-Free Nitrogen. Dry, inert gas used for pressure testing, purging while brazing and breaking a vacuum. Always used through a regulator because the cylinder is at around 200 bar."},
{k:"Maximum allowable pressure",alt:["PS"],d:"PS, the maximum pressure the system or component is designed and rated for, stated by the manufacturer. Strength tests are done at 1.1 x PS and tightness tests at PS."},
{k:"Strength test",alt:["strength (pressure) test","pressure test"],d:"A test with OFN at 1.1 times the maximum allowable pressure to prove the pipework and joints will not burst. Done before the tightness test and before any refrigerant is added."},
{k:"Tightness test",alt:["standing pressure test","standing pressure"],d:"A leak test with OFN, usually at the maximum allowable pressure, held long enough (often 24 hours) to show no pressure drop once temperature changes are allowed for."},
{k:"Evacuation",alt:["evacuate","evacuating","evacuated","deep vacuum","vacuum"],d:"Pulling a vacuum on the system with a vacuum pump to remove air (non-condensables) and boil off moisture before charging. Target below 500 microns, then hold to check it does not rise."},
{k:"Micron",alt:["microns"],d:"A unit of very low absolute pressure used for vacuum work. 1000 microns = 1 torr = 1.33 mbar. 500 microns is about 0.67 mbar absolute. Atmospheric pressure is about 760,000 microns."},
{k:"Non-condensables",alt:["non-condensable"],d:"Gases such as air or nitrogen that will not condense in the condenser. They collect there, raise head pressure above the saturation pressure and reduce efficiency. Removed by proper evacuation."},
{k:"Triple evacuation",d:"Pull a vacuum, break it with OFN, pull again, break again, pull a third time. The dry nitrogen absorbs residual moisture, which is removed on the next pull. Used on wet or contaminated systems."},
{k:"Filter drier",alt:["drier","filter-drier"],d:"A component in the liquid line containing desiccant to absorb moisture and acid, with a screen to trap particles. Replace it whenever the system is opened."},
{k:"Sight glass",d:"A small window in the liquid line. Clear glass means a full column of liquid; bubbles mean flash gas, usually from low charge or a restriction. Many include a moisture indicator that changes colour when wet."},
{k:"Schrader valve",alt:["Schrader","Schrader core","Schrader cores","valve core"],d:"A spring-loaded service valve like a tyre valve, used at gauge ports. The core is for service access only; the screw-on cap with its seal is the primary leak seal."},
{k:"TEV",alt:["thermostatic expansion valve","TXV"],d:"Thermostatic Expansion Valve. Meters liquid into the evaporator and controls superheat using a sensing bulb clamped to the evaporator outlet."},
{k:"Expansion device",alt:["expansion valve","capillary"],d:"The component (TEV, electronic expansion valve or capillary tube) that drops the refrigerant pressure from the high side to the low side, so the liquid can boil at a low temperature in the evaporator."},
{k:"Evaporator",d:"The heat exchanger where low-pressure liquid refrigerant boils and absorbs heat from the air, water or product. This is the cold coil, indoors on an air conditioner."},
{k:"Condenser",d:"The heat exchanger where high-pressure vapour from the compressor gives up its heat and condenses to liquid. This is the hot coil, outdoors on an air conditioner."},
{k:"Compressor",d:"The pump of the system. Draws in low-pressure vapour from the evaporator and discharges it at high pressure and temperature so it can condense."},
{k:"Receiver",alt:["liquid receiver"],d:"A vessel after the condenser that stores liquid refrigerant and allows for changes in charge demand. Also used to hold the charge during pump-down."},
{k:"Suction accumulator",alt:["accumulator"],d:"A vessel in the suction line that catches any liquid refrigerant before it reaches the compressor, letting it boil off safely."},
{k:"Reversing valve",alt:["four-way valve"],d:"The four-way valve in a heat pump that redirects the compressor discharge so the indoor coil becomes the condenser (heating) or the evaporator (cooling)."},
{k:"High side",d:"The high-pressure part of the circuit: compressor discharge, condenser, receiver, liquid line, drier and sight glass up to the expansion device. The red gauge reads it."},
{k:"Low side",d:"The low-pressure part of the circuit: from the expansion device through the evaporator and suction line to the compressor inlet. The blue compound gauge reads it."},
{k:"Head pressure",alt:["discharge pressure","condensing pressure"],d:"The pressure on the high side, between the compressor discharge and the expansion device. High head pressure points to a dirty condenser, fan failure, overcharge or non-condensables."},
{k:"Suction pressure",alt:["evaporating pressure"],d:"The pressure on the low side, in the evaporator and suction line. Low suction pressure points to low charge, a restriction or a blocked evaporator."},
{k:"Compound gauge",d:"The blue low-side gauge on a manifold. It reads both vacuum (below atmospheric) and pressure, hence compound. Not accurate enough to measure a deep vacuum."},
{k:"HP cut-out",alt:["high pressure cut-out","high pressure (HP) cut-out"],d:"A pressure switch that stops the compressor when discharge pressure rises too high."},
{k:"LP cut-out",alt:["low pressure cut-out","low pressure (LP) cut-out"],d:"A pressure switch that stops the compressor when suction pressure falls too low, protecting it on loss of charge or a blockage."},
{k:"Floodback",alt:["liquid floodback","slugging","liquid return"],d:"Liquid refrigerant reaching the compressor. Liquid cannot be compressed, so it damages valves and pistons and washes oil off the bearings."},
{k:"Copper plating",d:"Copper dissolved by acid in a wet system deposits itself on hot steel bearing surfaces inside the compressor, causing wear and seizure. A sign of moisture contamination."},
{k:"Oxide scale",alt:["copper oxide scale","copper oxide"],d:"Black flaky copper oxide that forms inside pipe when it is brazed with air in it. It breaks off and blocks driers, strainers and expansion valves. Prevented by purging with OFN."},
{k:"Brazing",alt:["braze","brazed"],d:"Joining copper pipe with a filler rod that melts above 450 degrees C (silver or copper-phosphorus alloy), using an oxy-acetylene or similar torch. Not soft soldering."},
{k:"Flux",d:"A paste that cleans the joint and stops oxides forming so the filler alloy flows. Needed for copper to brass or steel; not needed with copper-phosphorus rods on copper to copper. Residue must be cleaned off."},
{k:"Recovery",alt:["recover","recovered","recovering"],d:"Removing refrigerant from a system into a recovery cylinder using a recovery machine, so it is not released to atmosphere. Required before opening the circuit, decommissioning or scrapping."},
{k:"Recycling",alt:["recycled","recycle"],d:"Basic cleaning of recovered refrigerant (oil separation, filtering, moisture removal) so it can be reused, normally in equipment belonging to the same owner."},
{k:"Reclamation",alt:["reclaimed","reclaim"],d:"Reprocessing recovered refrigerant at a specialist facility to meet a virgin product standard (e.g. AHRI 700) so it can be sold and used anywhere."},
{k:"Push-pull",alt:["push-pull method"],d:"A fast recovery method for large liquid charges. The recovery machine pulls vapour from the top of the cylinder and pushes it into the system, forcing liquid out of the system into the cylinder."},
{k:"Recovery cylinder",alt:["recovery cylinders"],d:"A refillable pressure cylinder, grey with a yellow shoulder in the UK, dedicated to one refrigerant and in test date. Never filled beyond 80% by weight."},
{k:"Operator",d:"Under the F-Gas Regulation, the person or company with actual control over the technical functioning of the equipment, normally the owner. Responsible for leak checks, records and using certified people."},
{k:"Undertaking",d:"The regulation's word for a business or company. An undertaking carrying out F-gas work needs a company certificate, as well as certified engineers."},
{k:"Company certificate",alt:["company certification","REFCOM"],d:"A certificate held by a business (not an individual) from an approved body such as REFCOM, Quidos or Bureau Veritas, confirming it has certified staff, the right tools and procedures. Required to carry out F-gas work."},
{k:"Personnel certificate",alt:["personnel certificates"],d:"An individual's F-gas qualification, such as City and Guilds 2079-11 Category I. Shows the person is competent to do the activities covered by that category."},
{k:"Phase-down",alt:["quota"],d:"The stepped reduction in the amount of HFC (in tonnes CO2e) that producers and importers may place on the market each year, enforced through quotas. It makes high-GWP gas scarce and expensive."},
{k:"Leak detection system",alt:["fixed leak detection","leak detection systems"],d:"A fixed, calibrated device that monitors for refrigerant in the air or system and alerts the operator. Mandatory at 500 tonnes CO2e and above; where fitted it doubles the allowed leak check interval. Must be checked every 12 months."},
{k:"Direct method",alt:["direct methods","direct leak"],d:"Leak checking the pipework itself: electronic detector, bubble solution, UV dye, or a nitrogen standing pressure test."},
{k:"Indirect method",alt:["indirect methods","indirect leak"],d:"Leak checking by looking at system behaviour: pressures, temperatures, compressor current, oil and liquid levels, sight glass. A change suggests a leak which is then confirmed by a direct method."},
{k:"Hazardous waste",d:"Waste that is harmful to people or the environment, which includes recovered refrigerant and used refrigeration oil. Must be moved by a registered carrier to a permitted site with a consignment note."},
{k:"Consignment note",d:"The document that travels with hazardous waste from producer to carrier to disposal site. Copies are kept for three years."},
{k:"ADR",d:"The European agreement on carrying dangerous goods by road. Refrigerant cylinders in a vehicle need correct labelling, securing, documents and in some cases driver training."},
{k:"COSHH",d:"Control of Substances Hazardous to Health Regulations. Requires employers to assess and control the risks from chemicals, including refrigerants, using information from the safety data sheet."},
{k:"Safety data sheet",alt:["SDS"],d:"The supplier's document for a substance giving its hazards, handling, storage, PPE, first aid and disposal information."},
{k:"PSSR",alt:["Pressure Systems Safety Regulations"],d:"Pressure Systems Safety Regulations 2000. Refrigeration systems with compressor motor power above 25 kW need a written scheme of examination and periodic inspection by a competent person."},
{k:"Written scheme of examination",d:"A document drawn up by a competent person listing which parts of a pressure system must be inspected, how and how often, as required by PSSR."},
{k:"Hot work permit",alt:["hot work"],d:"A site authorisation for brazing, welding or grinding. Sets out precautions: removing flammables, extinguisher on hand, fire watch during and after the work."},
{k:"Decommissioning",alt:["decommission","decommissioned"],d:"Taking equipment permanently out of service. The refrigerant must be recovered by a certified person and the recovery and disposal recorded."},
{k:"EN 378",d:"The European standard for the safety and environmental requirements of refrigerating systems and heat pumps. Covers pressure testing, charge limits for flammable refrigerants and plant room requirements."},
{k:"AR4",alt:["IPCC AR4"],d:"The IPCC Fourth Assessment Report (2007). Its 100-year GWP values are the ones written into the F-Gas Regulation and used for CO2e calculations."},
{k:"Ambient",alt:["ambient temperature"],d:"The temperature of the surrounding air. Head pressure rises with ambient on an air-cooled condenser, and nitrogen test pressures change with it."},
{k:"Asphyxiation",d:"Suffocation from lack of oxygen. Refrigerant vapour is heavier than air and odourless, so a leak in a plant room or pit displaces the oxygen at low level without warning."},
{k:"Frostbite",alt:["cold burns"],d:"Freezing injury to skin or eyes caused by liquid refrigerant flashing off at well below 0 degrees C. Prevented by gloves and eye protection."},
{k:"Hydrogen fluoride",d:"A highly toxic and corrosive gas produced when HFC refrigerants break down in a flame or on a very hot surface. The reason you never braze on a charged system."},
{k:"Service ban",alt:["2020 service ban"],d:"Since 1 January 2020, virgin HFCs with a GWP of 2500 or more may not be used to service equipment with a charge of 40 tonnes CO2e or more. Recycled or reclaimed gas is allowed until 2030."},
{k:"Virgin refrigerant",alt:["virgin"],d:"New, unused refrigerant straight from the manufacturer, as opposed to recovered, recycled or reclaimed gas."},
{k:"Pump-down",alt:["pump down"],d:"Running the compressor with the liquid line valve closed to collect the charge in the receiver or condenser, so the low side can be opened for service without recovering the whole charge."}
];
const GLmap=new Map(); GL.forEach((g,i)=>{[g.k,...(g.alt||[])].forEach(a=>GLmap.set(a.toLowerCase(),i))});
const GLre=new RegExp("(?<![\\\\w-])("+[...GLmap.keys()].sort((a,b)=>b.length-a.length).map(a=>a.replace(/[.*+?^${}()|[\\]\\\\]/g,"\\\\$&")).join("|")+")(?![\\\\w-])","gi");
function mark(text){ return esc(text).replace(GLre,(m)=>`<span class="term" role="button" tabindex="0" data-g="${GLmap.get(m.toLowerCase())}">${m}</span>`); }
function openTerm(i){
  const g=GL[i]; let bg=document.getElementById("sheet-bg");
  if(!bg){bg=document.createElement("div");bg.className="sheet-bg";bg.id="sheet-bg";document.body.appendChild(bg);bg.onclick=e=>{if(e.target===bg)bg.remove()};}
  bg.innerHTML=`<div class="sheet" role="dialog" aria-label="${esc(g.k)}"><div class="h"><h3>${esc(g.k)}</h3><button type="button" class="x" aria-label="Close">&times;</button></div><p class="d">${mark(g.d)}</p><p class="see">Tap any dotted word for its meaning. Full list under Glossary.</p></div>`;
  bg.querySelector(".x").onclick=()=>bg.remove(); bg.querySelector(".x").focus();
}
document.addEventListener("click",e=>{const t=e.target.closest(".term"); if(t)openTerm(+t.dataset.g)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){const b=document.getElementById("sheet-bg"); if(b)b.remove()} const t=e.target.closest&&e.target.closest(".term"); if(t&&(e.key==="Enter"||e.key===" ")){e.preventDefault();openTerm(+t.dataset.g)}});

/* ---------- State ---------- */
const PASS=0.7, EXAM_N=30;
let state={screen:"home",mode:"practice",topics:Object.keys(T),queue:[],idx:0,answers:{},chosen:null,checked:false};
let stats=load();
function load(){try{const s=JSON.parse(localStorage.getItem("fgas-stats")||"{}");return {attempts:s.attempts||0,correct:s.correct||0,perTopic:s.perTopic||{},wrong:s.wrong||{}}}catch(e){return {attempts:0,correct:0,perTopic:{},wrong:{}}}}
function save(){try{localStorage.setItem("fgas-stats",JSON.stringify(stats))}catch(e){}}
function record(q,ok){stats.attempts++; if(ok)stats.correct++; const pt=stats.perTopic[q.t]||{a:0,c:0}; pt.a++; if(ok)pt.c++; stats.perTopic[q.t]=pt; if(ok)delete stats.wrong[q.id]; else stats.wrong[q.id]=(stats.wrong[q.id]||0)+1; save();}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pct(c,a){return a?Math.round(100*c/a):0}
const app=document.getElementById("app");
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

/* ---------- Screens ---------- */
function start(mode,ids){
  state.mode=mode;
  let pool = ids ? ids.map(i=>Q[i]) : Q.filter(q=>state.topics.includes(q.t));
  pool=shuffle(pool);
  if(mode==="exam") pool=pool.slice(0,EXAM_N);
  state.queue=pool.map(q=>({q,order:shuffle([0,1,2,3])}));
  state.idx=0; state.answers={}; state.chosen=null; state.checked=false; state.screen="quiz";
  render(); window.scrollTo(0,0);
}
function renderHome(){
  const wrongIds=Object.keys(stats.wrong).map(Number);
  const poolN=Q.filter(q=>state.topics.includes(q.t)).length;
  const weakest=Object.entries(stats.perTopic).filter(([,v])=>v.a>=3).sort((a,b)=>pct(a[1].c,a[1].a)-pct(b[1].c,b[1].a))[0];
  app.innerHTML=`
  <div class="stack">
    <div>
      <p class="label">City &amp; Guilds 2079-11 · Level 2 Award</p>
      <h1>F-Gas &amp; ODS Category I practice</h1>
      <p class="muted" style="margin-top:8px">Answer a question, get told straight away whether you were right, and read why. ${Q.length} questions across the syllabus.</p>
    </div>
    <div class="card stack">
      <p class="label">Choose how to practise</p>
      <div class="modes">
        <button type="button" class="mode" id="mode-practice" aria-pressed="${state.mode==="practice"}"><span class="t">Practice</span><span class="d">Marked after every question, with the explanation. Pick the topics you want.</span></button>
        <button type="button" class="mode exam" id="mode-exam" aria-pressed="${state.mode==="exam"}"><span class="t">Mock exam</span><span class="d">${EXAM_N} random questions from the chosen topics, marked at the end. Pass mark ${PASS*100}%.</span></button>
      </div>
      <p class="label">Topics</p>
      <div class="chips" id="chips">${Object.entries(T).map(([k,v])=>`<button type="button" class="chip" data-t="${k}" aria-pressed="${state.topics.includes(k)}">${v}<span class="n">${Q.filter(q=>q.t===k).length}</span></button>`).join("")}</div>
      <div class="footer-actions">
        <span class="muted" id="pool-n">${poolN} questions selected</span>
        <button type="button" class="btn ${state.mode==="exam"?"amber":"primary"}" id="start-btn" ${poolN?"":"disabled"}>${state.mode==="exam"?"Start mock exam":"Start practising"}</button>
      </div>
    </div>
    <div class="card stack">
      <p class="label">Your progress on this device</p>
      ${stats.attempts?`
      <div class="score">
        <div class="tile"><div class="b">${stats.attempts}</div><div class="l">questions answered</div></div>
        <div class="tile"><div class="b ${pct(stats.correct,stats.attempts)>=70?"pass":"fail"}">${pct(stats.correct,stats.attempts)}%</div><div class="l">correct overall</div></div>
        <div class="tile"><div class="b">${wrongIds.length}</div><div class="l">still to get right</div></div>
      </div>
      ${weakest?`<p class="muted">Weakest topic so far: <strong>${T[weakest[0]]}</strong> at ${pct(weakest[1].c,weakest[1].a)}%.</p>`:""}
      <div class="row">
        <button type="button" class="btn" id="retry-btn" ${wrongIds.length?"":"disabled"}>Retry the ${wrongIds.length} you got wrong</button>
        <button type="button" class="btn" id="reset-btn">Reset progress</button>
      </div>`:`<p class="muted">Nothing answered yet. Scores and the questions you get wrong are remembered on this device so you can come back to them.</p>`}
    </div>
    <p class="note">Questions are written from the 2079-11 syllabus and the GB F-Gas and ODS Regulations, using the GWP values the regulation uses (IPCC AR4). This is revision material, not official City &amp; Guilds content. If anything here disagrees with the HSS workbook or the tutor, go with the workbook.</p>
  </div>`;
  document.getElementById("mode-practice").onclick=()=>{state.mode="practice";renderHome()};
  document.getElementById("mode-exam").onclick=()=>{state.mode="exam";renderHome()};
  document.querySelectorAll("#chips .chip").forEach(b=>b.onclick=()=>{const t=b.dataset.t; state.topics=state.topics.includes(t)?state.topics.filter(x=>x!==t):[...state.topics,t]; renderHome()});
  document.getElementById("start-btn").onclick=()=>start(state.mode);
  const r=document.getElementById("retry-btn"); if(r)r.onclick=()=>start("practice",wrongIds);
  const rs=document.getElementById("reset-btn"); if(rs)rs.onclick=()=>{ if(rs.dataset.arm){stats={attempts:0,correct:0,perTopic:{},wrong:{}};save();renderHome()} else {rs.dataset.arm="1";rs.textContent="Tap again to confirm reset"} };
}
function renderQuiz(){
  const item=state.queue[state.idx], q=item.q, n=state.queue.length, exam=state.mode==="exam";
  const letters=["A","B","C","D"];
  app.innerHTML=`
  <div class="stack ${exam?"exam":""}">
    <div class="qmeta"><span>${exam?"MOCK EXAM":"PRACTICE"} · Q ${state.idx+1} of ${n}</span><span>${exam?"":"Score "+Object.values(state.answers).filter(a=>a.ok).length+" / "+Object.keys(state.answers).length}</span></div>
    <div class="progress"><i style="width:${100*state.idx/n}%"></i></div>
    <div class="card stack">
      <span class="topic">${T[q.t]}</span>
      <p class="qtext">${mark(q.q)}</p>
      <div class="opts" id="opts">${item.order.map((oi,k)=>`<button type="button" class="opt" data-o="${oi}" aria-pressed="${state.chosen===oi}"><span class="k">${letters[k]}</span><span>${esc(q.a[oi])}</span></button>`).join("")}</div>
      <div id="fb"></div>
      <div class="footer-actions">
        <span class="kbd">Keys: A to D to answer, Enter to continue</span>
        <div class="row">
          <button type="button" class="btn" id="quit-btn">${exam?"Abandon":"Finish"}</button>
          <button type="button" class="btn ${exam?"amber":"primary"}" id="next-btn" disabled>${exam?"Next":"Check answer"}</button>
        </div>
      </div>
    </div>
  </div>`;
  const opts=[...document.querySelectorAll(".opt")], nextBtn=document.getElementById("next-btn"), fb=document.getElementById("fb");
  function choose(oi){ if(state.checked)return; state.chosen=oi; opts.forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.o===oi))); nextBtn.disabled=false; }
  function check(){
    const ok=state.chosen===q.c; state.answers[q.id]={ok,chosen:state.chosen}; record(q,ok); state.checked=true;
    opts.forEach(b=>{b.disabled=true; const o=+b.dataset.o; if(o===q.c)b.classList.add("right"); else if(o===state.chosen)b.classList.add("wrong");});
    fb.innerHTML=`<div class="feedback ${ok?"ok":"no"}"><span class="v">${ok?"Correct":"Not quite"}</span><span class="why">${mark(q.e)}</span></div>`;
    nextBtn.textContent=state.idx+1<n?"Next question":"See results"; nextBtn.focus();
  }
  function advance(){ state.idx++; state.chosen=null; state.checked=false; if(state.idx>=n){state.screen="results"} render(); window.scrollTo(0,0); }
  opts.forEach(b=>b.onclick=()=>choose(+b.dataset.o));
  nextBtn.onclick=()=>{ if(exam){ state.answers[q.id]={ok:state.chosen===q.c,chosen:state.chosen}; record(q,state.chosen===q.c); advance(); } else if(!state.checked) check(); else advance(); };
  document.getElementById("quit-btn").onclick=()=>{ if(exam||!Object.keys(state.answers).length){state.screen="home"} else {state.screen="results"} render(); window.scrollTo(0,0); };
  app.onkeydown=null;
  document.onkeydown=e=>{ if(state.screen!=="quiz")return; const k=e.key.toUpperCase(); const i=letters.indexOf(k); if(i>-1&&i<opts.length){choose(+opts[i].dataset.o)} else if(e.key==="Enter"&&!nextBtn.disabled){nextBtn.click()} };
}
function renderResults(){
  const items=state.queue.filter(it=>state.answers[it.q.id]!==undefined), n=items.length;
  const correct=items.filter(it=>state.answers[it.q.id].ok).length, p=pct(correct,n), exam=state.mode==="exam";
  const byT={}; items.forEach(it=>{const t=it.q.t; byT[t]=byT[t]||{a:0,c:0}; byT[t].a++; if(state.answers[it.q.id].ok)byT[t].c++;});
  const missed=items.filter(it=>!state.answers[it.q.id].ok);
  app.innerHTML=`
  <div class="stack">
    <div><p class="label">${exam?"Mock exam result":"Practice session"}</p><h1>${n?(p>=PASS*100?"That's a pass":"Not there yet"):"Nothing answered"}</h1></div>
    <div class="card stack">
      <div class="score">
        <div class="tile"><div class="b ${p>=PASS*100?"pass":"fail"}">${p}%</div><div class="l">score (pass mark ${PASS*100}%)</div></div>
        <div class="tile"><div class="b">${correct} / ${n}</div><div class="l">correct</div></div>
        <div class="tile"><div class="b">${missed.length}</div><div class="l">to go over</div></div>
      </div>
      ${Object.keys(byT).length>1?`<div style="overflow-x:auto"><table><thead><tr><th>Topic</th><th></th><th style="text-align:right">Right</th></tr></thead><tbody>
        ${Object.entries(byT).sort((a,b)=>pct(a[1].c,a[1].a)-pct(b[1].c,b[1].a)).map(([t,v])=>`<tr><td>${T[t]}</td><td><div class="bar"><i style="width:${pct(v.c,v.a)}%"></i></div></td><td class="num">${v.c}/${v.a}</td></tr>`).join("")}
      </tbody></table></div>`:""}
      <div class="row">
        ${missed.length?`<button type="button" class="btn primary" id="retry-missed">Retry the ${missed.length} missed</button>`:""}
        <button type="button" class="btn" id="again-btn">${exam?"Another mock exam":"Practise again"}</button>
        <button type="button" class="btn" id="home2-btn">Home</button>
      </div>
    </div>
    ${missed.length?`<div class="stack"><h2>Go over these</h2><div class="review">${missed.map(it=>{const q=it.q,a=state.answers[q.id];return `<div class="rv"><span class="topic">${T[q.t]}</span><span class="q">${mark(q.q)}</span><span class="you">Your answer: ${a.chosen===null?"not answered":esc(q.a[a.chosen])}</span><span class="ans">Correct: ${esc(q.a[q.c])}</span><span class="muted">${mark(q.e)}</span></div>`}).join("")}</div></div>`:(n?`<p class="muted">Every answer right. Try a mock exam across all topics.</p>`:"")}
  </div>`;
  const rm=document.getElementById("retry-missed"); if(rm)rm.onclick=()=>start("practice",missed.map(it=>it.q.id));
  document.getElementById("again-btn").onclick=()=>start(state.mode);
  document.getElementById("home2-btn").onclick=()=>{state.screen="home";render()};
}

function renderGlossary(){
  app.innerHTML=`<div class="stack">
    <div><p class="label">Jargon buster</p><h1>Glossary</h1><p class="muted" style="margin-top:8px">${GL.length} terms from the syllabus. These same words are dotted in the questions: tap one for its meaning.</p></div>
    <input class="search" id="gl-search" type="search" placeholder="Search, e.g. absolute pressure" autocomplete="off">
    <div class="card"><div class="gl" id="gl-list"></div></div>
    <button type="button" class="btn" id="gl-back">${state.queue.length&&state.idx<state.queue.length?"Back to the question":"Back"}</button>
  </div>`;
  const list=document.getElementById("gl-list"), inp=document.getElementById("gl-search");
  const sorted=GL.map((g,i)=>({g,i})).sort((a,b)=>a.g.k.localeCompare(b.g.k));
  const draw=()=>{const f=inp.value.trim().toLowerCase(); const rows=sorted.filter(({g})=>!f||g.k.toLowerCase().includes(f)||(g.alt||[]).some(a=>a.toLowerCase().includes(f))||g.d.toLowerCase().includes(f));
    list.innerHTML=rows.length?rows.map(({g,i})=>`<div class="g"><b>${esc(g.k)}${g.alt&&g.alt.length?` <span class="muted" style="font-family:var(--body);font-weight:400;font-size:14px">(${esc(g.alt.slice(0,2).join(", "))})</span>`:""}</b><span>${mark(g.d)}</span></div>`).join(""):`<p class="muted">No term matches that. Try a shorter word.</p>`};
  inp.oninput=draw; draw();
  document.getElementById("gl-back").onclick=()=>{state.screen=state.prev||"home";render()};
}
function render(){
  document.getElementById("hdr-stat").textContent=stats.attempts?`${pct(stats.correct,stats.attempts)}% over ${stats.attempts} answered`:"";
  if(state.screen==="home")renderHome(); else if(state.screen==="quiz")renderQuiz(); else if(state.screen==="glossary")renderGlossary(); else renderResults();
}
document.getElementById("home-btn").onclick=()=>{state.screen="home";render()};
document.getElementById("gl-btn").onclick=()=>{ if(state.screen!=="glossary"){state.prev=state.screen; state.screen="glossary"; render(); window.scrollTo(0,0);} };
window.claude?.hot?.snapshot?.(()=>state);
const boot=d=>{ if(d&&d.screen&&d.queue){ state=d; state.queue=d.queue.map(it=>({q:Q[it.q.id]||it.q,order:it.order})); } render(); };
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data);
</script>
</body>
</html>
