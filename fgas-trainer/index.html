<header><div class="wrap">
  <button class="brand" id="home-btn" type="button">F-Gas Cat I Trainer <span class="tag">2079-11</span></button>
  <div class="hdr-actions"><div class="stat" id="hdr-stat"></div><button type="button" class="btn small" id="gl-btn">Glossary</button></div>

<script>
/* ---------- Question bank ---------- */
const T = {
  R:"Regulations & certification", G:"Refrigerants & GWP", L:"Leak checking",
  V:"Recovery & disposal", I:"Installation & commissioning", S:"System operation",
  H:"Health & safety", D:"Records & operator duties"
};
const Q = [
// Regulations
{t:"R",q:"What is the main purpose of the F-Gas Regulation?",a:["To reduce emissions of fluorinated greenhouse gases and limit their use","To protect the ozone layer from chlorine-based refrigerants","To set minimum energy efficiency ratings for air conditioning","To control the price of refrigerant cylinders"],c:0,e:"The F-Gas Regulation (EU 517/2014, kept in GB law after Brexit) exists to cut emissions of fluorinated greenhouse gases such as HFCs. Ozone protection is the job of the separate ODS Regulation."},
{t:"R",q:"Which regulation controls ozone depleting substances such as R22?",a:["The ODS Regulation (EC 1005/2009 as kept in GB law)","The F-Gas Regulation","The Pressure Equipment Regulations","The Building Regulations Part L"],c:0,e:"R22 is an HCFC containing chlorine, so it is an ozone depleting substance. It is controlled by the ODS Regulation, not the F-Gas Regulation, although both are covered in the 2079 syllabus."},
{t:"R",q:"Which F-gas personnel category allows you to carry out all activities (leak checking, recovery, installation, maintenance and decommissioning) on any charge size?",a:["Category I","Category II","Category III","Category IV"],c:0,e:"Category I is the full qualification (2079-11). The other categories are restricted either by activity or by charge size."},
{t:"R",q:"A Category II certificate holder may install, maintain and recover refrigerant from systems containing:",a:["Less than 3 kg of F-gas (6 kg if hermetically sealed and labelled as such)","Any charge size, as long as it is below 500 tonnes CO2e","Less than 10 kg of F-gas","Only hermetically sealed systems"],c:0,e:"Category II covers leak checks without breaking into the circuit on any system, but install, maintenance, service and recovery only on systems under 3 kg (6 kg hermetically sealed and labelled)."},
{t:"R",q:"A Category IV certificate permits which activity?",a:["Leak checking only, without breaking into the refrigerant circuit","Recovery from systems under 3 kg","Installation of small split systems","Brazing of refrigerant pipework"],c:0,e:"Category IV is leak checking only, and only by methods that do not break into the circuit. Category III is recovery from small systems."},
{t:"R",q:"A Category III certificate permits which activity?",a:["Recovery of refrigerant from systems containing less than 3 kg (6 kg hermetic)","Leak checking of any system","Installation of systems under 3 kg","Maintenance of systems up to 50 tonnes CO2e"],c:0,e:"Category III allows recovery only, from small systems (under 3 kg, or under 6 kg if hermetically sealed and labelled). It does not permit installation or maintenance."},
{t:"R",q:"When was the use of recycled or reclaimed R22 for servicing finally banned?",a:["1 January 2015","1 January 2010","1 January 2020","1 January 2025"],c:0,e:"Virgin R22 was banned for servicing from 1 January 2010. Recycled and reclaimed R22 could be used until 31 December 2014, so the total ban started 1 January 2015. Systems may still run on their existing charge but cannot be topped up."},
{t:"R",q:"Since 1 January 2020 it has been prohibited to service or maintain equipment with a charge of 40 tonnes CO2e or more using:",a:["Virgin HFCs with a GWP of 2500 or more","Any HFC refrigerant","Reclaimed HFCs of any GWP","Natural refrigerants"],c:0,e:"The 2020 service ban applies to virgin (new) HFCs with a GWP of 2500 or more, such as R404A, in systems of 40 tonnes CO2e or more. Recycled or reclaimed high-GWP refrigerant may still be used until 2030. The ban does not apply to equipment designed to cool below minus 50 degrees C."},
{t:"R",q:"How does the HFC phase-down work?",a:["A quota system limits the amount of HFC, measured in CO2 equivalent, that producers and importers may place on the market each year","Each contractor is allowed a fixed number of kilograms per year","All HFC refrigerants are banned from a single date","Only refrigerants with a GWP above 2500 are restricted"],c:0,e:"The phase-down works through quotas on producers and importers, measured in tonnes CO2e. The quota steps down over time, which pushes the market towards lower-GWP refrigerants and makes high-GWP gas scarce and expensive."},
{t:"R",q:"Who enforces the F-Gas Regulation in Great Britain?",a:["The environmental regulator (Environment Agency in England, Natural Resources Wales, SEPA in Scotland)","The Health and Safety Executive","City and Guilds","The local fire authority"],c:0,e:"The Environment Agency enforces F-gas in England, with Natural Resources Wales and SEPA in Wales and Scotland. The HSE deals with health and safety and pressure systems, not F-gas compliance."},
{t:"R",q:"A business that installs, services, repairs or decommissions stationary refrigeration, air conditioning or heat pump equipment containing F-gas must hold:",a:["A company (undertaking) certificate from a certification body such as REFCOM, in addition to its engineers holding personnel certificates","Only personnel certificates for each engineer","A licence from the local council","An ISO 9001 certificate"],c:0,e:"Both are needed. Individual engineers need a personnel certificate (such as 2079-11) and the business itself must hold a company certificate from an approved body such as REFCOM, Quidos or Bureau Veritas."},
{t:"R",q:"Non-hermetically sealed equipment pre-charged with HFCs (for example a split air conditioning system) may only be sold to an end user if:",a:["There is evidence that it will be installed by a certified person or company","The buyer signs a disclaimer","The charge is below 3 kg","The GWP is below 2500"],c:0,e:"The regulation requires evidence that installation will be carried out by a certified undertaking. This stops uncertified people fitting pre-charged splits and losing refrigerant."},
{t:"R",q:"What must the label on equipment containing F-gas state?",a:["That it contains F-gas, the refrigerant designation, the charge in kg and its CO2 equivalent, and the GWP","Only the refrigerant name","The installer's phone number and the date of installation","The energy rating of the equipment"],c:0,e:"Labels must say the equipment contains fluorinated greenhouse gases, give the refrigerant designation (e.g. R410A), the quantity in kg and tonnes CO2e, and the GWP. If gas is added on site the label must be updated."},
{t:"R",q:"From 1 January 2020, new stationary refrigeration equipment was banned from containing HFCs with a GWP of:",a:["2500 or more","150 or more","750 or more","1000 or more"],c:0,e:"New stationary refrigeration equipment with HFCs of GWP 2500 or more (such as R404A) has been banned since 2020, except equipment designed to cool products below minus 50 degrees C."},
{t:"R",q:"From 1 January 2025, single split air conditioning systems containing less than 3 kg of F-gas are banned if the refrigerant has a GWP of:",a:["750 or more","2500 or more","150 or more","2088 or more"],c:0,e:"The 2025 ban targets small single splits using refrigerants with GWP of 750 or more, which rules out R410A (GWP 2088). R32 (GWP 675) is below the limit, which is why the market moved to it."},
{t:"R",q:"Domestic refrigerators and freezers have been banned from containing HFCs with a GWP of 150 or more since:",a:["1 January 2015","1 January 2020","1 January 2010","1 January 2025"],c:0,e:"Since 2015 new domestic fridges and freezers cannot use HFCs with a GWP of 150 or more. Most now use R600a (isobutane), a hydrocarbon with a GWP of about 3."},
{t:"R",q:"Which of these best describes a hermetically sealed system under the F-Gas Regulation?",a:["All refrigerant-containing parts are made tight by welding, brazing or a similar permanent connection, and the tested leak rate is below 3 g per year","Any system with a sealed compressor","A system that has never been opened since manufacture","A system with no service ports"],c:0,e:"The definition requires permanent joints (brazed or welded, though capped valves and service ports are allowed) and a leak rate under 3 g per year at a quarter of the maximum allowable pressure. Such systems are given relaxed leak check thresholds when labelled as hermetically sealed."},
{t:"R",q:"Under the F-Gas Regulation, who is the 'operator' of a piece of equipment?",a:["The person or company exercising actual power over the technical functioning of the equipment, normally the owner","The engineer who services it","The manufacturer","The certification body"],c:0,e:"The operator is whoever has real control over the equipment, usually the owner or the business running the premises. The operator carries the legal duties for leak checks, records and using certified people, even though the engineer does the work."},
{t:"R",q:"Which of these is an F-gas?",a:["R134a (an HFC)","R22 (an HCFC)","R290 (propane)","R744 (carbon dioxide)"],c:0,e:"F-gases are fluorinated greenhouse gases: HFCs, PFCs and SF6. R134a is an HFC. R22 is an ozone depleting HCFC covered by the ODS Regulation, and propane and CO2 are natural refrigerants outside both."},
{t:"R",q:"Is it an offence to deliberately release F-gas to atmosphere?",a:["Yes. Intentional release is prohibited and operators must take all precautions to prevent unintentional release","No, provided the quantity is below 3 kg","No, as long as it is done outdoors","Only if the GWP is above 2500"],c:0,e:"Deliberate venting is prohibited. Operators and technicians must take all technically and economically feasible precautions to prevent leaks, and any detected leak must be repaired without undue delay."},

// Refrigerants & GWP
{t:"G",q:"What is the Global Warming Potential (GWP) of carbon dioxide (R744)?",a:["1","0","100","10"],c:0,e:"GWP is measured relative to CO2 over 100 years, so CO2 has a GWP of 1 by definition. Everything else is compared against it."},
{t:"G",q:"What is the GWP of R410A (the value used in the F-Gas Regulation)?",a:["2088","675","1430","3922"],c:0,e:"R410A has a GWP of 2088 (AR4 value, which the regulation uses). R32 is 675, R134a is 1430 and R404A is 3922."},
{t:"G",q:"What is the GWP of R404A?",a:["3922","2088","1810","1430"],c:0,e:"R404A has a GWP of 3922, which is why it is caught by the 2500 GWP bans and the 2020 service ban on virgin gas in systems of 40 tonnes CO2e or more."},
{t:"G",q:"What is the GWP of R134a?",a:["1430","675","2088","3922"],c:0,e:"R134a has a GWP of 1430. It is a pure HFC (not a blend) with no temperature glide."},
{t:"G",q:"What is the GWP of R32?",a:["675","1430","2088","4"],c:0,e:"R32 has a GWP of 675, roughly a third of R410A, which is why it replaced R410A in small splits. It is A2L (mildly flammable)."},
{t:"G",q:"A system contains 5 kg of R410A. What is its charge in tonnes CO2 equivalent?",a:["10.44 tonnes","5 tonnes","2.088 tonnes","104.4 tonnes"],c:0,e:"CO2e = charge in kg multiplied by GWP, divided by 1000 to give tonnes. 5 x 2088 = 10,440 kg = 10.44 tonnes CO2e. That is above 5 tonnes, so the system needs a leak check at least every 12 months."},
{t:"G",q:"How many kilograms of R404A equal the 5 tonne CO2e leak check threshold?",a:["About 1.27 kg","About 5 kg","About 3 kg","About 12.7 kg"],c:0,e:"5000 kg CO2e divided by GWP 3922 = 1.27 kg. Even a small R404A system reaches the first leak check threshold."},
{t:"G",q:"A system holds 3 kg of R134a. Does it reach the 5 tonne CO2e threshold for mandatory periodic leak checks?",a:["No. 3 x 1430 = 4290 kg, which is 4.29 tonnes CO2e","Yes. Any system over 3 kg is caught","Yes, because R134a is an HFC","Only if it is not hermetically sealed"],c:0,e:"3 kg x 1430 = 4290 kg = 4.29 tonnes CO2e, which is below 5 tonnes. No mandatory periodic leak check interval applies, but leaks must still be prevented and repaired and only certified people may work on it."},
{t:"G",q:"Which of these is an HFO refrigerant?",a:["R1234yf","R410A","R290","R717"],c:0,e:"R1234yf and R1234ze are hydrofluoro-olefins (HFOs). They have very low GWP (around 4 or less) but are A2L mildly flammable. R410A is an HFC blend, R290 is propane and R717 is ammonia."},
{t:"G",q:"Which of these is a natural refrigerant?",a:["R290 (propane)","R134a","R407C","R1234ze"],c:0,e:"Natural refrigerants include hydrocarbons such as R290 (propane) and R600a (isobutane), R744 (CO2) and R717 (ammonia). They are not F-gases but each has its own safety hazards, in this case high flammability (A3)."},
{t:"G",q:"R22 is classed as which type of refrigerant?",a:["HCFC: it contains chlorine and depletes the ozone layer","HFC: a fluorinated greenhouse gas","HFO: a low-GWP synthetic","Hydrocarbon"],c:0,e:"R22 is a hydrochlorofluorocarbon. The chlorine gives it an ozone depletion potential, so it is controlled by the ODS Regulation. It also has a high GWP of 1810."},
{t:"G",q:"Why must zeotropic blends such as R407C be charged as a liquid from the cylinder?",a:["The components boil at different temperatures, so charging vapour would change the blend composition","Liquid charging is faster and nothing else matters","Vapour charging would freeze the cylinder","Liquid charging reduces the GWP"],c:0,e:"Zeotropic (R400 series) blends have components with different boiling points. Taking vapour off the cylinder removes the more volatile components first, leaving the wrong mix in both cylinder and system. Always charge liquid, metered carefully so liquid does not reach the compressor."},
{t:"G",q:"What is 'temperature glide'?",a:["The difference between the bubble point and dew point of a zeotropic blend at a given pressure","The drop in temperature across the expansion valve","The rise in temperature across the compressor","The change in cylinder temperature while charging"],c:0,e:"Zeotropic blends do not boil or condense at one fixed temperature. At a given pressure they start to boil at the bubble point and finish at the dew point. That spread is the glide. Use the dew point for superheat and the bubble point for subcooling."},
{t:"G",q:"Which numbering series is used for azeotropic blends?",a:["R500 series (e.g. R507A)","R400 series (e.g. R407C)","R700 series (e.g. R717)","R600 series (e.g. R600a)"],c:0,e:"Azeotropic blends behave like a single refrigerant and are numbered in the 500 series. Zeotropic blends are 400 series. 700 series are inorganic (ammonia, CO2) and 600 series are hydrocarbons such as isobutane."},
{t:"G",q:"In the safety classification A2L, what does each part mean?",a:["A = lower toxicity, 2L = lower flammability with a low burning velocity","A = flammable, 2L = low toxicity","A = ammonia based, 2L = class 2 liquid","A = approved, 2L = two litre charge limit"],c:0,e:"The letter is toxicity (A lower, B higher). The number is flammability: 1 no flame propagation, 2L lower flammability, 2 flammable, 3 higher flammability. R32 and R1234yf are A2L, R290 is A3, R134a and R410A are A1, ammonia is B2L."},
{t:"G",q:"Which type of oil is used with HFC refrigerants such as R134a and R410A?",a:["Polyol ester (POE) oil, which is hygroscopic","Mineral oil","Engine oil","Vegetable oil"],c:0,e:"HFCs do not mix with mineral oil, so POE oil is used. POE is highly hygroscopic (absorbs moisture from the air), so oil containers must be kept sealed and systems opened for the shortest possible time."},
{t:"G",q:"Why must different refrigerants never be mixed in a system or a recovery cylinder?",a:["Mixed refrigerant cannot be reclaimed, must be sent for destruction, and gives unpredictable pressures and performance","It is permitted as long as the GWPs are similar","Because the blend will become flammable","Because it voids the cylinder warranty"],c:0,e:"Mixed gas has no pressure-temperature data, can damage the system, and cannot be separated economically. It has to be destroyed at cost. Always identify the refrigerant before recovery and use a dedicated cylinder."},
{t:"G",q:"GWP compares a gas to CO2 over what time period?",a:["100 years","10 years","1 year","1000 years"],c:0,e:"GWP values in the regulation are the 100-year figures from the IPCC Fourth Assessment Report (AR4)."},
{t:"G",q:"What is the difference between recovered, recycled and reclaimed refrigerant?",a:["Recovered is removed into a container; recycled has basic cleaning such as oil separation and filtering; reclaimed is reprocessed at a facility to virgin specification","They are three words for the same thing","Recovered is clean, recycled is dirty, reclaimed is destroyed","Reclaimed is the only one that may be reused"],c:0,e:"Recovery is simply taking it out of the system. Recycling is basic on-site cleaning for reuse, typically in the same owner's equipment. Reclamation means reprocessing at a specialist facility to meet a virgin standard such as AHRI 700, after which it can be sold as reclaimed."},
{t:"G",q:"What does ODP measure?",a:["Ozone depletion potential, relative to R11 which equals 1","The oil dilution point of a refrigerant","Operating design pressure","The temperature glide of a blend"],c:0,e:"ODP is the ozone depletion potential compared with R11 (CFC-11) at 1.0. HFCs and HFOs contain no chlorine or bromine and have an ODP of zero."},
{t:"G",q:"Which refrigerant in this list has the highest GWP?",a:["R404A","R410A","R134a","R32"],c:0,e:"R404A at 3922 is the highest. R410A is 2088, R134a is 1430 and R32 is 675."},

// Leak checking
{t:"L",q:"Equipment containing 5 tonnes CO2e or more of F-gas (but less than 50) must be leak checked at least every:",a:["12 months (24 months if a fixed leak detection system is fitted)","6 months","3 months","24 months in all cases"],c:0,e:"The intervals are: 5 tonnes or more every 12 months, 50 tonnes or more every 6 months, 500 tonnes or more every 3 months. A fixed leak detection system doubles the allowed interval in each band."},
{t:"L",q:"Equipment containing 50 tonnes CO2e or more (but less than 500) must be leak checked at least every:",a:["6 months (12 months with a leak detection system)","12 months","3 months","Month"],c:0,e:"50 to 500 tonnes CO2e is the middle band: every 6 months, or every 12 months if a fixed leak detection system is installed."},
{t:"L",q:"Equipment containing 500 tonnes CO2e or more must be leak checked at least every:",a:["3 months (6 months with a leak detection system), and a leak detection system is mandatory","6 months","12 months","Week"],c:0,e:"At 500 tonnes CO2e or more the check is every 3 months (6 with detection), and a fixed leak detection system that alerts the operator must be fitted."},
{t:"L",q:"Hermetically sealed equipment that is labelled as such is exempt from mandatory periodic leak checks if it contains less than:",a:["10 tonnes CO2e","5 tonnes CO2e","3 kg","50 tonnes CO2e"],c:0,e:"Labelled hermetically sealed equipment has a higher threshold of 10 tonnes CO2e before periodic leak checks become mandatory, compared with 5 tonnes for other equipment."},
{t:"L",q:"After a leak has been repaired, the equipment must be checked again to confirm the repair worked within:",a:["1 month","1 week","6 months","12 months"],c:0,e:"The regulation requires a follow-up leak check within one month of a repair to verify it was effective. Ideally the repaired joint is also tested before recharging."},
{t:"L",q:"Fixed leak detection systems must be checked for correct function at least every:",a:["12 months","3 months","6 months","5 years"],c:0,e:"Where a leak detection system is used (and relied on to double the leak check interval) it must be checked at least every 12 months to ensure it works."},
{t:"L",q:"Which of these is an indirect leak checking method?",a:["Analysing operating pressures, temperatures, compressor current, oil and liquid levels for signs of refrigerant loss","Electronic leak detector","Soap bubble solution on a joint","UV dye and lamp"],c:0,e:"Indirect methods look at system behaviour (pressures, temperatures, sight glass, oil level, running current) for evidence of a leak. Direct methods test the pipework itself: electronic detectors, bubble solution, UV dye, or a nitrogen standing pressure test."},
{t:"L",q:"An electronic leak detector used for F-gas leak checks must have a sensitivity of at least:",a:["5 g per year, and be checked every 12 months","50 g per year","1 kg per year","There is no minimum"],c:0,e:"Electronic detectors must detect at least 5 g per year and be verified every 12 months. The detector should also suit the refrigerant in use."},
{t:"L",q:"A system has 12 kg of R410A and no fixed leak detection. How often must it be leak checked?",a:["Every 12 months (12 x 2088 = 25 tonnes CO2e)","Every 6 months","Every 3 months","No check required"],c:0,e:"12 kg x 2088 = 25,056 kg = 25.06 tonnes CO2e. That is in the 5 to 50 tonne band, so every 12 months."},
{t:"L",q:"A pack holds 30 kg of R404A without a leak detection system. How often must it be leak checked?",a:["Every 6 months (30 x 3922 = 117.7 tonnes CO2e)","Every 12 months","Every 3 months","Every 24 months"],c:0,e:"30 kg x 3922 = 117,660 kg = 117.66 tonnes CO2e, which is in the 50 to 500 tonne band, so every 6 months."},
{t:"L",q:"Which of these is the best first indication of where to look for a leak on a system?",a:["Oil staining around joints, flares, valves and the compressor shaft seal","The colour of the pipe insulation","The nameplate GWP","The age of the compressor"],c:0,e:"Refrigerant carries oil with it, so a leak usually leaves an oily or dusty stain. Joints, flare nuts, Schrader cores, valve stems and shaft seals are the usual suspects."},
{t:"L",q:"How should an electronic leak detector probe be used on a suspected joint?",a:["Moved slowly, below the joint, because most refrigerants are heavier than air","Moved quickly above the joint","Held still at arm's length","Pressed firmly against the pipe"],c:0,e:"Refrigerant vapour sinks, so the probe should be moved slowly (about 25 to 50 mm per second) underneath joints. Draughts and other vapours can give false readings, so confirm with bubble solution."},
{t:"L",q:"A nitrogen standing pressure test shows a small drop in pressure overnight. What must you consider before declaring a leak?",a:["The change in ambient temperature, since pressure falls as the gas cools","Whether the nitrogen has leaked through the pipe walls","Whether the GWP has changed","Nothing. Any drop is a leak"],c:0,e:"Gas pressure changes with temperature, so a reading taken cold in the morning will be lower than one taken warm. Compare temperature-corrected readings over a long enough period before concluding."},
{t:"L",q:"Who is legally responsible for making sure the mandatory leak checks are carried out?",a:["The operator of the equipment","The engineer who installed it","The refrigerant supplier","The certification body"],c:0,e:"The operator (normally the owner) must ensure leak checks are done at the right intervals by certified personnel and must keep the records. The contractor does the work, but the duty rests with the operator."},
{t:"L",q:"What should be done with a leak once it is found?",a:["Repair it without undue delay, then re-check within one month","Top up the refrigerant and note it for next year","Leave it if the loss is less than 1 kg a year","Add leak sealant to the system"],c:0,e:"Detected leaks must be repaired as soon as possible. Repeated topping up without repair is an offence. The repair must be verified within one month."},
{t:"L",q:"Which gas is used for a standing pressure leak test on a new installation?",a:["Oxygen-free nitrogen (OFN) through a regulator","Compressed air","Oxygen","Acetylene"],c:0,e:"OFN is dry, inert and cheap. Compressed air introduces moisture and can form an explosive mixture with oil. Oxygen can explode on contact with oil. A regulator is essential because the cylinder pressure is far above any system rating."},

// Recovery & disposal
{t:"V",q:"A recovery cylinder must never be filled beyond what proportion of its capacity?",a:["80% by weight, checked on scales","100%","95%","50%"],c:0,e:"Liquid expands when warmed. A cylinder filled above 80% can become hydraulically full and rupture. Weigh the cylinder on scales during recovery and stop at 80% of its rated capacity (or rely on the float switch as a backup only)."},
{t:"V",q:"What colour are refrigerant recovery cylinders in the UK?",a:["Grey body with a yellow shoulder","Green","Red","Blue"],c:0,e:"UK recovery cylinders are grey with a yellow top, which makes them easy to distinguish from virgin refrigerant cylinders. They must be labelled with the refrigerant they contain."},
{t:"V",q:"Before using a recovery cylinder, you should:",a:["Check it is in test date, is dedicated to the right refrigerant, and evacuate it to remove air and moisture","Fill it with nitrogen","Heat it to speed up recovery","Leave the valve open to let air out"],c:0,e:"Cylinders are pressure vessels and must be in date. A cylinder containing air (non-condensables) will contaminate the recovered gas and raise pressures, so pull a vacuum on it first. Never mix refrigerants."},
{t:"V",q:"Which recovery method is fastest for a large liquid charge?",a:["Liquid recovery, or the push-pull method","Vapour recovery only","Recovery through the suction service valve with the system running","Venting the liquid to atmosphere first"],c:0,e:"Recovering liquid moves far more refrigerant per minute than vapour. Push-pull uses the recovery machine to pull vapour from the cylinder and push it into the system, forcing liquid out into the cylinder. Finish with vapour recovery to pull the system down."},
{t:"V",q:"When must refrigerant be recovered from a system?",a:["Before any work that opens the circuit, before decommissioning and before disposal of the equipment","Only when the equipment is scrapped","Only when the charge exceeds 3 kg","Never, if the system is under 5 tonnes CO2e"],c:0,e:"Recovery is required whenever the refrigerant would otherwise be released: opening the circuit for repair, decommissioning, and before equipment is scrapped. A certified person must do it."},
{t:"V",q:"Recovered refrigerant that is to be sent away for reclamation or destruction is classed as:",a:["Hazardous waste, which must go with a licensed waste carrier using a consignment note","Ordinary commercial waste","Scrap metal","Non-hazardous recyclable material"],c:0,e:"Waste refrigerant is hazardous waste. It must be moved by a registered waste carrier to a permitted facility, with a hazardous waste consignment note. Oil drained from the system is also hazardous waste as it contains dissolved refrigerant."},
{t:"V",q:"Recovered refrigerant may be reused without reclamation:",a:["After recycling, in equipment belonging to the same owner","In any customer's equipment","Never","Only if the GWP is below 750"],c:0,e:"Recycled (basically cleaned) refrigerant can go back into the same owner's equipment. To be sold or used elsewhere it must be reclaimed to virgin specification by a licensed facility."},
{t:"V",q:"Can recovered refrigerant be put into an empty disposable (virgin) cylinder?",a:["No. Only approved refillable recovery cylinders may be used","Yes, if it is the same refrigerant","Yes, if the cylinder is in test date","Yes, up to 50% full"],c:0,e:"Disposable cylinders are not designed or tested for refilling and have no relief device suited to it. Refilling one is dangerous and illegal. Use a dedicated, in-date recovery cylinder."},
{t:"V",q:"What does the float switch on a recovery cylinder do?",a:["Stops the recovery machine when the cylinder reaches 80% full","Indicates the refrigerant type","Vents excess pressure","Measures the vacuum level"],c:0,e:"The float switch is a backup to prevent overfilling. It should not replace weighing the cylinder on scales."},
{t:"V",q:"When recovering a flammable (A2L or A3) refrigerant, the recovery machine must be:",a:["Rated for flammable refrigerants (spark-free) and used in a ventilated area away from ignition sources","Any standard machine","Run at maximum speed to reduce exposure time","Earthed to the water main"],c:0,e:"Standard recovery machines contain switches and motors that can ignite a flammable gas. Use a machine certified for A2L or A3 refrigerants, ventilate the area and remove all ignition sources."},
{t:"V",q:"To what level should a system normally be recovered before opening it for repair?",a:["To a low pressure or slight vacuum as specified by the regulation and recovery unit instructions, so that as little refrigerant as possible remains","To atmospheric pressure","Until the cylinder is full","Until the recovery machine gets warm"],c:0,e:"Recover until the system is below atmospheric pressure (a slight vacuum) so minimal gas is released when the circuit is opened. Break the vacuum with OFN before brazing."},
{t:"V",q:"What should you do with compressor oil drained from a system?",a:["Treat it as hazardous waste because it contains dissolved refrigerant","Pour it down a drain","Reuse it in the new compressor","Burn it in a workshop heater"],c:0,e:"Used refrigeration oil contains refrigerant and possibly acids and metal particles. It must be stored in a sealed container and disposed of as hazardous waste."},

// Installation & commissioning
{t:"I",q:"Why is oxygen-free nitrogen purged through the pipework while brazing?",a:["To stop copper oxide scale forming inside the pipe, which would contaminate the system and block filters and expansion valves","To cool the joint faster","To stop the flame blowing out","To make the brazing rod flow more easily"],c:0,e:"Heating copper in air forms black oxide scale on the inside of the pipe. Scale breaks off and blocks driers, strainers and expansion valves. A gentle OFN purge displaces the air and keeps the pipe clean."},
{t:"I",q:"Which gas must never be used to pressure test a refrigeration system?",a:["Oxygen or compressed air","Oxygen-free nitrogen","Dry nitrogen with a trace of the system refrigerant","Helium"],c:0,e:"Oxygen reacts explosively with oil in the system. Compressed air contains moisture and can also form an explosive mixture with oil. Only OFN (or OFN with a small trace of refrigerant where permitted) should be used."},
{t:"I",q:"A strength (pressure) test on a new installation is typically carried out at:",a:["1.1 times the maximum allowable pressure (PS) of the system, with OFN","Half the maximum allowable pressure","The normal operating suction pressure","10 bar for all systems"],c:0,e:"EN 378 calls for a strength test at 1.1 x PS as a minimum (higher factors apply to some components). This proves the pipework will not burst. It is followed by a tightness test, usually at PS, held long enough to confirm no pressure drop."},
{t:"I",q:"What is the purpose of evacuating a system before charging?",a:["To remove air (non-condensables) and boil off moisture","To remove oil from the pipework","To check the compressor runs","To cool the pipework down"],c:0,e:"Air causes high head pressures and inefficiency. Moisture reacts with POE oil and refrigerant to form acid, causes copper plating and freezes at the expansion device. A deep vacuum lowers the boiling point of water so it evaporates and is pumped out."},
{t:"I",q:"To what vacuum level should a system be evacuated before charging?",a:["Below 500 microns (about 0.67 mbar), then held to check it does not rise","Below 29 inches on the manifold gauge","Below 1 bar","Below 5000 microns"],c:0,e:"Industry practice is to pull below 500 microns and hold. If the vacuum rises quickly there is a leak; if it creeps up slowly and stalls there is still moisture boiling off. A manifold compound gauge is not accurate enough."},
{t:"I",q:"How should the vacuum in a system be measured?",a:["With an electronic micron (vacuum) gauge connected at the system, not at the pump","With the blue compound gauge on the manifold","By listening to the vacuum pump","With a tyre pressure gauge"],c:0,e:"A compound gauge cannot resolve the difference between 5000 and 500 microns. An electronic vacuum gauge fitted to the system, isolated from the pump, gives a true reading of what the system is holding."},
{t:"I",q:"What is 'triple evacuation'?",a:["Evacuating, breaking the vacuum with OFN, and repeating so that three vacuums are pulled to flush out moisture","Running three vacuum pumps at once","Evacuating for three hours","Evacuating three separate ports"],c:0,e:"Breaking the vacuum with dry nitrogen absorbs residual moisture, which is then removed on the next evacuation. It is used on wet or contaminated systems where a single deep vacuum struggles."},
{t:"I",q:"Why is a two-stage vacuum pump preferred, and why must its oil be changed regularly?",a:["It reaches a deeper vacuum, and its oil absorbs moisture which limits the vacuum it can pull","It is quieter, and the oil is a fire hazard","It is cheaper, and old oil smells","It can run on 110 V, and old oil goes solid"],c:0,e:"A two-stage pump pulls well below 500 microns. Moisture pumped out of the system condenses in the pump oil, which raises the ultimate vacuum, so change the oil often, ideally after each wet job."},
{t:"I",q:"What is the correct order of commissioning tasks on a new split system?",a:["Strength and tightness test with OFN, evacuate, charge by weight, run and check superheat and subcooling","Charge, evacuate, pressure test, run","Evacuate, pressure test, charge, run","Run, charge, pressure test, evacuate"],c:0,e:"Pressure test first (leaks are found before the gas goes in), then evacuate to remove air and moisture, then weigh in the charge, then run the system and verify performance."},
{t:"I",q:"How should the refrigerant charge be measured when charging a system?",a:["By weight, using electronic scales, with the nameplate charge plus any allowance for additional pipe length","By watching the sight glass only","By charging until the suction pressure reaches 5 bar","By counting the seconds the cylinder is open"],c:0,e:"Weighing is the accurate method. Manufacturers state the charge and an extra amount per metre of pipe beyond the pre-charged length. Sight glass and pressures are then used to confirm, not to set, the charge."},
{t:"I",q:"What does a filter drier do?",a:["Removes moisture, acid and small particles from the refrigerant","Separates oil from the refrigerant","Reduces the GWP of the refrigerant","Controls the superheat"],c:0,e:"The drier's desiccant core absorbs moisture and acid, and its screen traps debris. It should be replaced whenever the system is opened."},
{t:"I",q:"Why should Schrader valve caps always be refitted?",a:["The cap is the primary seal; the valve core alone is likely to weep refrigerant","To stop dust entering the gauge port","It is only cosmetic","To hold the core in place"],c:0,e:"Schrader cores are a service aid, not a long-term seal. The brass cap with its seal is what stops leaks. Missing caps are a very common cause of slow refrigerant loss."},
{t:"I",q:"Which brazing rod can be used on copper-to-copper joints without flux?",a:["Silver-copper-phosphorus alloy (e.g. 2% to 15% silver)","High-silver solder with flux is always needed","Soft lead solder","Aluminium rod"],c:0,e:"Copper-phosphorus rods are self-fluxing on copper. Joining copper to brass or steel needs a high-silver alloy with a suitable flux, and the flux residue must be cleaned off afterwards."},
{t:"I",q:"What are the effects of moisture in a refrigeration system?",a:["Acid formation, copper plating, sludge and ice blockage at the expansion device","Higher cooling capacity","Lower head pressure","Nothing, because the oil absorbs it"],c:0,e:"Water reacts with refrigerant and POE oil to produce acids, which attack windings and cause copper plating of bearings. Free water freezes at the expansion device and blocks it intermittently."},
{t:"I",q:"Why is the suction line insulated?",a:["To stop condensation and to prevent the vapour picking up heat, which would raise superheat and compressor temperature","To make it look tidy","To reduce vibration","To stop the pipe being scratched"],c:0,e:"The suction line is cold. Uninsulated it sweats, drips and absorbs heat from the room, which adds superheat and raises discharge temperature, and reduces capacity."},
{t:"I",q:"How should liquid refrigerant be added to a running system?",a:["Metered slowly into the suction side, never as a slug of liquid directly into the compressor","Opened fully into the compressor suction","Poured into the condenser","Only through the discharge port"],c:0,e:"Liquid entering the compressor causes slugging and damage. Charge liquid into the liquid line with the system off, or meter it carefully into the suction line (some manifolds have a throttling device) so it flashes to vapour before the compressor."},

// System operation
{t:"S",q:"In a refrigeration system, which component absorbs heat and makes the refrigerant cold?",a:["The evaporator, where low-pressure liquid boils and absorbs latent heat","The condenser","The compressor","The receiver"],c:0,e:"After the expansion device the refrigerant is a cold, low-pressure liquid. In the evaporator it boils, taking latent heat from the air or product. The condenser does the opposite, rejecting heat as the vapour turns back to liquid."},
{t:"S",q:"What does the condenser do?",a:["Rejects heat so the high-pressure vapour condenses into a liquid","Absorbs heat from the room","Raises the pressure of the refrigerant","Meters refrigerant into the evaporator"],c:0,e:"Hot high-pressure vapour from the compressor gives up its heat (sensible first, then latent) to the outside air or water and condenses into a warm liquid."},
{t:"S",q:"What does the compressor do?",a:["Raises the pressure and temperature of the refrigerant vapour and circulates it","Cools the refrigerant","Turns vapour into liquid","Reduces the pressure of the liquid"],c:0,e:"The compressor draws in low-pressure vapour from the evaporator and discharges it at high pressure and temperature so it can condense at ambient temperature. It is the pump of the system."},
{t:"S",q:"What does the expansion device do?",a:["Drops the pressure of the liquid, which lowers its boiling point, and meters flow into the evaporator","Raises the pressure of the liquid","Separates oil from refrigerant","Stores excess refrigerant"],c:0,e:"The TEV, electronic valve or capillary creates the pressure drop between the high side and low side. The sudden drop in pressure means the liquid can now boil at a low temperature in the evaporator."},
{t:"S",q:"What is superheat and where is it measured?",a:["The temperature of the vapour above its saturation temperature, measured at the evaporator outlet or suction line","The temperature of the compressor discharge","The liquid temperature below saturation at the condenser outlet","The difference between room and evaporator temperature"],c:0,e:"Superheat = actual suction line temperature minus the saturated evaporating temperature (found from the suction pressure on a PT chart). It proves all the liquid has boiled before the compressor. Typically 5 to 10 K."},
{t:"S",q:"What is subcooling and where is it measured?",a:["The temperature of the liquid below its saturation temperature, measured at the condenser outlet or liquid line","The temperature of the suction line","The evaporator outlet temperature","The temperature drop across the drier"],c:0,e:"Subcooling = saturated condensing temperature (from the discharge pressure) minus the actual liquid line temperature. It confirms a solid column of liquid is reaching the expansion device. Typically 3 to 8 K."},
{t:"S",q:"Which set of symptoms suggests a system is low on refrigerant?",a:["Low suction pressure, high superheat, low subcooling and bubbles in the sight glass","High head pressure and high subcooling","Low superheat and liquid returning to the compressor","High compressor current and high suction pressure"],c:0,e:"With too little refrigerant the evaporator is starved. Suction pressure drops, the vapour leaves the evaporator very superheated, there is little liquid to subcool and the sight glass shows bubbles. Find and fix the leak before topping up."},
{t:"S",q:"Which symptoms suggest a system is overcharged?",a:["High head pressure, high subcooling, low superheat and high compressor current","Bubbles in the sight glass","Low suction pressure and high superheat","Frost on the condenser"],c:0,e:"Excess refrigerant backs up in the condenser, raising head pressure and subcooling. Liquid may reach the compressor (low superheat) and the motor works harder."},
{t:"S",q:"What is the effect of air (non-condensables) in a system?",a:["High head pressure above the saturation pressure for the condensing temperature, and poor efficiency","Lower head pressure","Higher cooling capacity","Frost on the suction line"],c:0,e:"Air does not condense and collects in the condenser, taking up space and adding its own partial pressure. The condensing pressure reads higher than the PT chart predicts for the measured liquid temperature. Proper evacuation prevents it."},
{t:"S",q:"What is latent heat?",a:["Heat added or removed during a change of state at constant temperature","Heat that changes the temperature of a substance","Heat produced by the compressor motor","Heat lost through pipe insulation"],c:0,e:"Latent heat is absorbed when a liquid boils and released when a vapour condenses, with no change in temperature. Sensible heat changes temperature. Refrigeration relies on latent heat because it moves far more energy per kilogram."},
{t:"S",q:"When measuring superheat and subcooling on a zeotropic blend, which values do you use?",a:["Dew point for superheat and bubble point for subcooling","Bubble point for both","Dew point for both","The average of the two"],c:0,e:"Superheat is measured from the point where the last drop of liquid has evaporated (dew point). Subcooling is measured from the point where the first bubble of vapour would form (bubble point)."},
{t:"S",q:"What does a thermostatic expansion valve (TEV) control?",a:["Evaporator superheat, by sensing the suction line temperature with its bulb","Condensing pressure","Compressor speed","The oil level"],c:0,e:"The TEV bulb on the evaporator outlet senses temperature. Rising superheat opens the valve to feed more refrigerant; falling superheat closes it. This keeps the evaporator fully used without flooding the compressor."},
{t:"S",q:"On a gauge manifold, what do the blue and red gauges read?",a:["Blue is the low side compound gauge (vacuum and pressure); red is the high side pressure gauge","Blue is the high side; red is the low side","Both read the same pressure","Blue reads temperature; red reads pressure"],c:0,e:"The blue compound gauge connects to the suction side and reads vacuum to around 20 bar. The red gauge connects to the discharge or liquid side and reads higher pressures. Most have PT scales for common refrigerants."},
{t:"S",q:"What protects the compressor against excessive discharge pressure?",a:["The high pressure (HP) cut-out switch","The low pressure (LP) cut-out","The filter drier","The sight glass"],c:0,e:"The HP switch stops the compressor if head pressure rises too high, for example from a blocked condenser or fan failure. The LP switch protects against loss of charge or a blocked liquid line."},
{t:"S",q:"Which of these components are on the high side of the system?",a:["Condenser, receiver, liquid line, filter drier and sight glass","Evaporator and suction line","Suction accumulator","Compressor suction valve"],c:0,e:"The high side runs from the compressor discharge through the condenser, receiver, liquid line, drier and sight glass to the expansion device. After the expansion device everything is low side until the compressor suction."},
{t:"S",q:"What does a reversing valve do in a heat pump?",a:["Swaps the roles of the indoor and outdoor coils so the system can heat or cool","Reverses the compressor rotation","Reverses the fan direction","Reverses the oil flow"],c:0,e:"The four-way reversing valve redirects the compressor discharge so that the indoor coil becomes the condenser in heating mode and the evaporator in cooling mode."},
{t:"S",q:"Why is liquid refrigerant returning to the compressor a problem?",a:["Liquid cannot be compressed, so it causes slugging, washes oil from bearings and can break valves","It makes the compressor run too cold and stop","It raises head pressure","It has no effect on a scroll compressor"],c:0,e:"Compressors are designed for vapour. Liquid floodback damages valves and pistons and dilutes the oil. Correct superheat and a suction accumulator where needed prevent it."},
{t:"S",q:"A sight glass showing a steady stream of bubbles with the system running normally most likely indicates:",a:["Low refrigerant charge (or a restriction upstream such as a blocked drier)","An overcharge","Too much oil","Normal operation on all systems"],c:0,e:"Bubbles mean flash gas in the liquid line, usually from insufficient charge or a pressure drop across a blocked drier. Confirm with subcooling before adding refrigerant, and look for the leak."},
{t:"S",q:"What does a moisture indicator in a sight glass show?",a:["A colour change (often green to yellow) when the refrigerant contains moisture","The oil level","The refrigerant charge in kg","The superheat"],c:0,e:"The indicator element changes colour with moisture content. A wet reading means the drier should be changed and the system dried out."},

// Health & safety
{t:"H",q:"What is the main hazard of a large refrigerant leak in a plant room or cold store?",a:["Asphyxiation, because the vapour is heavier than air and displaces oxygen at low level","Fire from all refrigerants","Skin irritation","Electric shock"],c:0,e:"Most refrigerants are heavier than air and odourless. They collect in low areas and displace oxygen. Ventilate, use an oxygen monitor or fixed detection, and never enter a suspected leak area alone."},
{t:"H",q:"What injury can liquid refrigerant cause on contact with skin or eyes?",a:["Frostbite (cold burns), because it boils at well below 0 degrees C","Chemical burns from acid","Sunburn","No injury, it is harmless"],c:0,e:"Liquid refrigerant flashes to vapour instantly and freezes tissue. Wear gloves and safety glasses when connecting hoses, charging or recovering."},
{t:"H",q:"What is produced when an HFC refrigerant is exposed to a naked flame or very hot surface?",a:["Toxic decomposition products such as hydrogen fluoride","Harmless carbon dioxide and water","Pure fluorine gas, which is safe","Nothing, HFCs are inert"],c:0,e:"Heat breaks HFCs down into hydrogen fluoride and other toxic, corrosive gases. This is why you must never braze on a charged system, must recover and purge with OFN first, and must ventilate well."},
{t:"H",q:"How may a refrigerant cylinder be warmed to speed up charging?",a:["With a purpose-made heater belt or warm water below 40 degrees C, never a naked flame","With a blowtorch","By placing it on a gas ring","By leaving it in the van exhaust"],c:0,e:"Direct heat can raise the pressure beyond the cylinder rating and cause rupture. Approved heater belts or a bucket of warm water are the only acceptable methods."},
{t:"H",q:"Before brazing on a system that has contained refrigerant you should:",a:["Recover the refrigerant, purge with OFN, confirm no residual pressure, remove flammables and have an extinguisher and hot work permit in place","Open a window and start brazing","Leave a small charge in to show up leaks","Run the compressor to clear the pipe"],c:0,e:"Brazing a pressurised line can blow molten metal out of the joint and decompose the refrigerant into toxic gas. Recover, make safe, purge with OFN and follow hot work procedures."},
{t:"H",q:"When working on an A2L (mildly flammable) refrigerant such as R32 you must:",a:["Remove ignition sources, ventilate, use tools and recovery equipment rated for flammable refrigerants and check for leaks before hot work","Treat it exactly like R410A","Use a halide torch to find leaks","Smoke only outside the plant room"],c:0,e:"A2L refrigerants need an ignition source and a concentrated leak to burn, but it can happen. Use spark-free equipment, a detector suitable for A2L, good ventilation and observe charge limits in EN 378."},
{t:"H",q:"How should refrigerant cylinders be stored and transported?",a:["Upright, secured, with valve caps fitted, in a ventilated area out of direct sunlight and below 50 degrees C","Lying flat in the van cab","Anywhere, as they are not hazardous","Outside in full sun to keep the pressure up"],c:0,e:"Cylinders must be secured so they cannot fall, kept cool and ventilated so leaks cannot build up, and carried with the correct hazard labels and documentation under ADR rules."},
{t:"H",q:"Under the Pressure Systems Safety Regulations 2000 (PSSR), which refrigeration systems normally require a written scheme of examination?",a:["Systems with a compressor motor power greater than 25 kW","All systems containing more than 3 kg","Only ammonia systems","None, refrigeration is exempt"],c:0,e:"PSSR exempts refrigeration systems where the installed compressor motor power is 25 kW or less. Larger systems need a written scheme of examination drawn up by a competent person and periodic inspection."},
{t:"H",q:"Which properties make ammonia (R717) hazardous?",a:["It is toxic, mildly flammable (B2L) and attacks copper, but its strong smell gives early warning","It is odourless and heavier than air","It has a very high GWP","It is harmless but expensive"],c:0,e:"Ammonia is classified B2L. It is toxic at low concentrations but its pungent smell means leaks are noticed quickly. It cannot be used with copper pipe or windings, so ammonia systems use steel."},
{t:"H",q:"What personal protective equipment is the minimum when charging or recovering refrigerant?",a:["Safety glasses or goggles and suitable gloves","A dust mask","Ear defenders","A high-visibility vest"],c:0,e:"Hoses and fittings can spray liquid refrigerant at the eyes and hands. Gloves must be suited to cold liquids. Other PPE depends on the site and the refrigerant."},
{t:"H",q:"Where would you find the hazard information and first aid advice for a specific refrigerant?",a:["On its Safety Data Sheet (SDS), as required under COSHH","On the F-gas certificate","In the Building Regulations","On the cylinder's test date stamp"],c:0,e:"Every refrigerant has a safety data sheet from the supplier describing hazards, handling, storage, PPE and first aid. COSHH requires employers to assess and control these risks."},
{t:"H",q:"Why must oxygen never be used to pressurise a system or blow out pipework?",a:["Oxygen reacts violently with oil and can cause an explosion","It is too expensive","It corrodes copper","It has a high GWP"],c:0,e:"Compressor oil and oil films in pipework will ignite or explode in a high-pressure oxygen atmosphere. Only oxygen-free nitrogen is used."},

// Records & operator duties
{t:"D",q:"How long must F-gas records for equipment be kept?",a:["At least 5 years, by both the operator and the contractor who did the work","1 year","3 months","Until the next leak check"],c:0,e:"Both the operator and the undertaking (contractor) must keep records for at least five years and make them available to the regulator on request."},
{t:"D",q:"Which of the following must be recorded for equipment subject to leak checks?",a:["Type and quantity of F-gas installed, quantities added or recovered, whether gas was recycled or reclaimed, who did the work, dates and results of leak checks, and decommissioning measures","Only the date of installation","Only the refrigerant type","The customer's VAT number"],c:0,e:"The regulation lists these items. If recycled or reclaimed gas is used, the name and address of the facility must also be recorded. Records must be updated after every intervention."},
{t:"D",q:"Records must be kept for equipment containing F-gas of:",a:["5 tonnes CO2e or more (the same threshold as mandatory leak checks)","Any quantity","3 kg or more","50 tonnes CO2e or more"],c:0,e:"Record keeping applies to equipment that is subject to leak checks, which starts at 5 tonnes CO2e (10 tonnes for labelled hermetic equipment). Keeping records for smaller systems is still good practice."},
{t:"D",q:"How can an operator check that a contractor is legally allowed to work on their F-gas equipment?",a:["Ask to see the company certificate (e.g. REFCOM) and the engineer's personnel certificate or card","Check they have a van with a logo","Ask for a quote","Check they are VAT registered"],c:0,e:"The operator has a duty to use certified people. Both a company certificate and an individual personnel certificate of the right category should be checked and the details recorded."},
{t:"D",q:"When refrigerant is added to a system on site, what must the engineer do to the equipment label?",a:["Update it with the new total charge in kg and CO2e","Nothing, the original label stays","Remove it","Write the date only"],c:0,e:"The label must reflect the actual quantity of F-gas in the equipment, so after adding gas the label (or an additional label) must be updated with the new charge."},
{t:"D",q:"A hazardous waste consignment note for recovered refrigerant must be kept for at least:",a:["3 years","6 months","5 years","10 years"],c:0,e:"Hazardous waste consignment notes are kept for three years by the producer and consignee. Note the difference from F-gas records, which are kept for five years."},
{t:"D",q:"Who must keep a copy of the F-gas record: the operator or the contractor?",a:["Both: the operator keeps the equipment record and the contractor keeps a copy of the work it has done","Only the operator","Only the contractor","Neither, the certification body keeps it"],c:0,e:"Operators must keep records of their equipment, and undertakings carrying out the work must keep copies of the same information for five years."},
{t:"D",q:"What should be recorded when equipment is decommissioned?",a:["The measures taken to recover and dispose of the refrigerant, including the quantity recovered","Only the date","Nothing, records end when the equipment stops","The scrap value"],c:0,e:"Decommissioning must be recorded, showing the refrigerant was recovered by a certified person and sent for reclamation or destruction via a licensed waste route."}
];
